<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#102A1D"/>
      <stop offset="100%" stop-color="#1F4D3A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#5B8C5A"/>
      <stop offset="100%" stop-color="#A9C7A6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" />

  <!-- Stylized overlapping leaves / hills -->
  <g opacity="0.95" filter="url(#soft)">
    <path d="M0 220 C150 160, 300 260, 480 210 C660 160, 820 240, 1200 180 L1200 360 L0 360 Z" fill="#0E3628"/>
    <path d="M0 240 C180 180, 380 280, 600 220 C820 160, 980 260, 1200 200 L1200 360 L0 360 Z" fill="#153F30" opacity="0.9"/>
  </g>

  <!-- Leaf motifs on the right -->
  <g transform="translate(820,40) scale(0.95)">
    <ellipse cx="180" cy="220" rx="90" ry="40" fill="#163F2F" opacity="0.6" />
    <path d="M120 120 C150 80, 220 80, 260 120 C300 160, 250 200, 200 220 C150 240, 90 200, 120 120 Z" fill="url(#leafGrad)" stroke="#7F5A42" stroke-width="2"/>
    <path d="M180 60 C200 40, 250 40, 280 60 C310 80, 300 110, 260 120 C220 130, 170 110, 180 60 Z" fill="#5B8C5A" opacity="0.95"/>
    <path d="M90 180 C120 150, 180 150, 210 180 C240 210, 200 240, 150 250 C100 260, 70 220, 90 180 Z" fill="#2E6B4C" opacity="0.9"/>
  </g>

  <!-- Title -->
  <g transform="translate(80,70)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#F3F1E8" font-weight="700">AI Research in Higher Education</text>
    <text x="0" y="48" font-family="Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#A9C7A6">Research on generative AI in higher education — impacts on learning, critical thinking, and teaching</text>

    <!-- Small decorative line -->
    <rect x="0" y="68" width="220" height="4" rx="2" fill="#D4A82A" opacity="0.95" />
  </g>

  <!-- Badge-like callouts -->
  <g transform="translate(80,140)">
    <rect x="0" y="0" rx="8" ry="8" width="220" height="36" fill="#1F4D3A" opacity="0.9" />
    <text x="16" y="24" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#F3F1E8">Status: Research in progress</text>

    <rect x="240" y="0" rx="8" ry="8" width="160" height="36" fill="#2E6B4C" opacity="0.9" />
    <text x="256" y="24" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#F3F1E8">Data & Notebooks</text>

    <rect x="420" y="0" rx="8" ry="8" width="120" height="36" fill="#5B8C5A" opacity="0.92" />
    <text x="434" y="24" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#102A1D">Cite: CITATION.cff</text>
  </g>

  <!-- Subtle author / repo credit -->
  <text x="80" y="320" font-family="Segoe UI, Roboto, Arial" font-size="12" fill="#A9C7A6">Sambridisharma / AI-Research-Fall26</text>

</svg>
